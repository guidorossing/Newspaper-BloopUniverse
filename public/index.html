<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rossing T&amp;M CMS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login-view" class="hidden">
    <div class="login-card">
      <h1>🎬 Rossing T&amp;M CMS</h1>
      <p class="muted">Production and channel management for faceless YouTube channels</p>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email address" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn primary">Sign in</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <nav id="sidebar">
      <div class="brand">🎬 Rossing T&amp;M</div>
      <button class="nav-btn" data-tab="dashboard">📊 Dashboard</button>
      <button class="nav-btn" data-tab="kanalen">📺 Channels</button>
      <button class="nav-btn" data-tab="ideeen">💡 Idea bank</button>
      <button class="nav-btn" data-tab="pipeline">🎬 Pipeline</button>
      <button class="nav-btn" data-tab="kalender">📅 Calendar</button>
      <button class="nav-btn" data-tab="templates">🧩 Templates</button>
      <button class="nav-btn" data-tab="todos">✅ To-dos</button>
      <button class="nav-btn" data-tab="instructies">📚 Instructions</button>
      <button class="nav-btn manager-only" data-tab="payouts">💶 Payouts</button>
      <button class="nav-btn manager-only" data-tab="rapport">📈 Reports</button>
      <button class="nav-btn manager-only" data-tab="vault">🔐 Channel Admin</button>
      <button class="nav-btn manager-only" data-tab="team">👥 Team</button>
      <button class="nav-btn admin-only" data-tab="instellingen">⚙️ Settings</button>
      <div class="sidebar-footer">
        <span id="user-badge"></span>
        <button id="logout-btn" class="btn small">Sign out</button>
      </div>
    </nav>
    <main id="content"></main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
