<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloop Universe CMS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login-view" class="hidden">
    <div class="login-card">
      <h1>🪐 Bloop Universe CMS</h1>
      <p class="muted">Productie- en kanaalbeheer voor faceless YouTube-kanalen</p>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="E-mailadres" required>
        <input type="password" id="login-password" placeholder="Wachtwoord" required>
        <button type="submit" class="btn primary">Inloggen</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>
  </div>

  <div id="app-view" class="hidden">
    <nav id="sidebar">
      <div class="brand">🪐 Bloop Universe</div>
      <button class="nav-btn" data-tab="dashboard">📊 Dashboard</button>
      <button class="nav-btn" data-tab="kanalen">📺 Kanalen</button>
      <button class="nav-btn" data-tab="pipeline">🎬 Pipeline</button>
      <button class="nav-btn" data-tab="todos">✅ To-do's</button>
      <button class="nav-btn" data-tab="instructies">📚 Instructiecentrum</button>
      <button class="nav-btn manager-only" data-tab="vault">🔐 Channel Admin</button>
      <button class="nav-btn manager-only" data-tab="team">👥 Team</button>
      <button class="nav-btn admin-only" data-tab="instellingen">⚙️ Instellingen</button>
      <div class="sidebar-footer">
        <span id="user-badge"></span>
        <button id="logout-btn" class="btn small">Uitloggen</button>
      </div>
    </nav>
    <main id="content"></main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
